<title id="title">Inside Salt Lake’s Changing Jail Population</title>
<desc id="desc">Venezuela-labelled citizenship bookings rose from 0.27% to 1.66% in the Q4 2023 versus Q4 2025 comparison. The chart shows the full monthly series through February 2026, with a gap in April 2025.</desc>
